services:
  - type: web
    name: gameping
    env: node
    plan: starter
    rootDir: Server
    buildCommand: npm run check
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GAMEPING_DATA_DIR
        value: /var/data
      - key: GAMEPING_API_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: gameping-data
      mountPath: /var/data
      sizeGB: 1
