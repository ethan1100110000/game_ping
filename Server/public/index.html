<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GamePing">
  <title>GamePing</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=9">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-button" id="profileButton" type="button" aria-label="내 정보">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1>GamePing</h1>
      <button class="icon-button" id="addFriendButton" type="button" aria-label="친구 추가">+</button>
    </header>

    <section class="message-tabs" aria-label="메시지 선택">
      <button class="selected" type="button" data-message="게임 시작">게임 시작</button>
      <button type="button" data-message="로비 와">로비 와</button>
      <button type="button" data-message="디코 와">디코 와</button>
      <button type="button" data-message="한 판 더">한 판 더</button>
    </section>

    <section class="panel">
      <div class="section-heading with-actions">
        <div class="heading-title">
          <span class="heading-dot"></span>
          <h3>친구</h3>
        </div>
        <div class="section-actions">
          <button class="secondary-action" id="partyCreateButton" type="button">파티 만들기</button>
          <button class="secondary-action hidden" id="partyCancelButton" type="button">취소</button>
          <button class="primary-small hidden" id="partyDoneButton" type="button">완료</button>
        </div>
      </div>
      <div class="list" id="friendList"></div>
      <div class="request-box hidden" id="friendRequestPanel">
        <div class="request-heading">친구 요청</div>
        <div class="request-list" id="friendRequestList"></div>
      </div>
    </section>

    <section class="party-box hidden" id="partyPanel">
      <button class="party-button" id="partyButton" type="button">
        <span>파티 호출</span>
        <strong>보내기</strong>
      </button>
      <div class="party-list" id="partyList"></div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div class="heading-title">
          <span class="heading-dot"></span>
          <h3>받은 호출</h3>
        </div>
      </div>
      <div class="list" id="inboxList"></div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div class="heading-title">
          <span class="heading-dot"></span>
          <h3>최근 호출</h3>
        </div>
      </div>
      <div class="list" id="recentList"></div>
    </section>
  </main>

  <dialog id="profileDialog">
    <form method="dialog" class="sheet">
      <div class="sheet-header">
        <h3>내 정보</h3>
        <button class="text-button" value="cancel" type="submit">닫기</button>
      </div>

      <section class="status-card">
        <div class="status-row">
          <span>서버</span>
          <strong id="statusText">서버 확인 중</strong>
        </div>
        <div class="status-row">
          <span>알림</span>
          <div class="status-action">
            <strong id="pushStatus">알림 확인 중</strong>
            <button id="pushButton" type="button">알림 켜기</button>
          </div>
        </div>
      </section>

      <label>
        표시 이름
        <input id="profileNameInput" autocomplete="nickname">
      </label>

      <label>
        내 초대 코드
        <div class="copy-row">
          <input id="inviteCodeInput" readonly>
          <button id="copyInviteButton" type="button">복사</button>
        </div>
      </label>

      <details class="advanced-settings">
        <summary>고급 설정</summary>
        <label>
          API 토큰
          <input id="apiTokenInput" autocomplete="off" placeholder="서버 토큰 사용 시 입력">
        </label>
      </details>

      <button class="primary-action" id="saveProfileButton" type="button">저장</button>
    </form>
  </dialog>

  <dialog id="friendDialog">
    <form method="dialog" class="sheet">
      <div class="sheet-header">
        <h3>친구 추가</h3>
        <button class="text-button" value="cancel" type="submit">닫기</button>
      </div>

      <label>
        초대 코드
        <input id="friendCodeInput" autocapitalize="characters" autocomplete="off" placeholder="GP-ABC123">
      </label>

      <button class="primary-action" id="resolveFriendButton" type="button">친구 요청 보내기</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js?v=9" type="module"></script>
</body>
</html>
